# Zulfi Portal profile (read by ZulfiConfig). Every key can be overridden with -D<key>=...
# Base URL precedence: -Dzulfi.baseUrl, legacy -DbaseUrlWeb, env ZULFI_BASE_URL, then this default.
# Portal must be HTTPS (PortalConfig enforces it).
zulfi.baseUrl=https://zulfi.zakaadash.com/zakaadashZulfi-portal-vue/

# Official analysis Happy Path - preferred index (skips known duplicates 0-1 when manifest resolves).
# Override: -Danalysis.fixture.index=N or env ZULFI_OFFICIAL_FIXTURE / -Danalysis.fixture.label
analysis.fixture.index=2

# US-FAP-HOME-CURRENT-RESULTS - configurable Default Club (override via env or -D)
portal.defaultClub.label=نادي الزلفي
portal.defaultClub.fragment=الزلفي

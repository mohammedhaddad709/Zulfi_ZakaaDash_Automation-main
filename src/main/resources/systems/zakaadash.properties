# ZakaaDash profile (read by ZakaaDashConfig). Every key can be overridden with -D<key>=...
# Legacy -Dzakaadash.base.url is still accepted when -Dzakaadash.baseUrl is not given.
zakaadash.baseUrl=https://app.dev.zakaadash.com/innova-vue
zakaadash.login.path=/auth/login?redirect=/data-versions
zakaadash.data.versions.path=/data-versions
zakaadash.environment.name=dev

zakaadash.explicit.wait=20
zakaadash.page.load.timeout=60
# Headless Chrome ignores maximize() and stays at ~784x497 (tablet layout); headless runs use this desktop size.
zakaadash.headless.window.width=1920
zakaadash.headless.window.height=1080

zakaadash.human.delay.enabled=true
zakaadash.human.delay.min.ms=1000
zakaadash.human.delay.max.ms=1100
zakaadash.human.delay.preprocessing.ms=1000
zakaadash.human.delay.step4.min.ms=1000
zakaadash.human.delay.step4.max.ms=1400

# Framework demo target used by HerokuLoginTest (not part of the ZakaaDash product).
zakaadash.demo.heroku.baseUrl=https://the-internet.herokuapp.com
